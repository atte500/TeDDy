# TeDDy Configuration

# The preferred external editor for reviewing and modifying plans/messages.
# Supports arbitrary command strings (e.g., "code --wait", "nvim -R", "zed").
# Fallback chain: Config -> VISUAL/EDITOR env vars -> discovery prompt.
editor: ""

# Optional diff viewer flags override. If set, these flags are used instead
# of the built-in translation table for this editor.
# Example: ["--diff", "--wait"]
# diff_flags: []

# Execution Settings
execution:
  default_timeout_seconds: 60
  similarity_threshold: 0.95 # 1.00 means exact match required (ignoring relative indentation).
  max_output_lines: 100 # Caps EXECUTE output to the last X lines.

# File Read Settings
read:
  max_lines: 1000 # Caps READ action output to the first X lines.

# Research Settings
research:
  max_results: 5 # Number of SERP results to retrieve and automatically scrape.

# Default for the --yolo / -y flag. When true, sessions auto-approve all
# actions (non-interactive) without needing to pass --yolo. The explicit
# --no-yolo / -n flag always overrides this setting for a single invocation.
yolo_default: false

# Safety limits enforced ONLY in --yolo mode. When a limit is hit the session
# is terminated with a message explaining how to adjust these values.
# Limits are per-run: `teddy resume` starts counting from 0 again.
yolo_guardrails:
  enabled: true
  max_turns: 99
  max_session_cost: 5.00

# Auto-Pruning Settings
# Intelligently pre-deselects context files to save tokens and manage complexity.
auto_pruning:
  enabled: true
  turn_context_threshold: 50000 # Token budget for Turn-scope files only (excludes session.context and system prompts). Triggers pruning of largest Turn-scope files if exceeded.
  prune_failure_history: true # Prune non-green turns once recovery is achieved.
  prune_validation_failures: true # Prune plans and reports that failed validation.
  preserve_message_turns: true # Ensure successful communicating turns are not pruned.
  max_turns_retention: 10 # Max number of turns persisted in session history (excl. initial request & preserved message turns).

# LLM Settings
# LiteLLM Configuration Reference: https://docs.litellm.ai/docs/completion/input
# All keys under 'llm' are passed directly to litellm.completion().
llm:
  model: "openrouter/~deepseek/deepseek-flash-latest:nitro"  # Syntax: "openrouter/<model-path>" (model paths: https://openrouter.ai/models); ":nitro"=fastest, ":floor"=cheapest.
  api_key: "${TEDDY_LLM_API_KEY}"  # Paste your key into .teddy/.env, or replace this with a literal value to override.
  max_retries: 3
  timeout: 300

# Local models (no API key needed — LiteLLM supplies a keyless default):
#   model: "ollama/llama3.2"      # Ollama (default endpoint http://localhost:11434)
#   model: "lm_studio/qwen2.5"    # LM Studio
#   model: "hosted_vllm/mistral"  # vLLM (set api_base to your server, e.g. http://localhost:8000/v1)

# Any OpenAI-compatible server (e.g. llama.cpp's llama-server) works via the
# openai/ prefix with an explicit endpoint and a non-empty api_key (a dummy
# value is fine). A provider prefix is required — an endpoint alone is rejected.
#   model: "openai/<model-name>"
#   api_base: "http://localhost:8080/v1"
#   api_key: "sk-noop"

# Any other LiteLLM/OpenAI-compatible parameters are forwarded unchanged
# (e.g. temperature, top_p, max_tokens). Omit them to keep provider defaults.

# OpenRouter provider routing (optional): prefer specific upstream providers,
# in order.
#   extra_body:
#     provider:
#       order: ["<provider-slug>"]  # Preference-ordered list of OpenRouter provider slugs.
