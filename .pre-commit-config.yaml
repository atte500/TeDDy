exclude: '^spikes/'
repos:
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # README.md documents a deliberate, non-secret placeholder API key
        # (`api_key: "your-openrouter-api-key-here"`) that detect-secrets cannot
        # distinguish from a real "Secret Keyword". Exclude it to remove the
        # pre-existing false positive (see PROJECT.md Technical Debt).
        exclude: 'poetry\.lock|\.secrets\.baseline|^README\.md$'

-   repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
    -   id: bandit
        args: ["-c", "pyproject.toml"]
        # Exclude tests and experimental code from bandit checks
        exclude: ^(tests|spikes)/

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        exclude: ^spikes/
    -   id: end-of-file-fixer
        exclude: ^spikes/
    -   id: check-toml
    -   id: check-added-large-files
        args: ['--maxkb=500']
        exclude: ^spikes/
    -   id: check-case-conflict
        exclude: ^spikes/
    -   id: check-merge-conflict
        exclude: ^spikes/

-   repo: local
    hooks:
    -   id: ruff-lint
        name: Ruff Linter
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
        require_serial: true

    -   id: ruff-format
        name: Ruff Formatter
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
        require_serial: true

    -   id: mypy
        name: Mypy
        entry: uv run mypy
        language: system
        types: [python]
        require_serial: true


    -   id: pip-audit
        name: Vulnerability Scanning (pip-audit)
        entry: uv run pip-audit --ignore-vuln PYSEC-2026-196
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

    -   id: check-core-di-boundary
        name: Check Core DI Boundary (No punq in core)
        entry: uv run python .githooks/check_core_di_boundary.py
        language: system
        types: [python]
        files: ^src/teddy_executor/core/

    -   id: check-explicit-utf8
        name: Enforce Explicit UTF-8 Encoding (Production)
        entry: uv run python .githooks/check_explicit_utf8.py
        language: system
        types: [python]
        files: ^src/

    -   id: no-hardcoded-tmp-paths
        name: No Hardcoded /tmp/ Paths in Test Files
        entry: uv run python .githooks/check_hardcoded_tmp.py
        language: system
        types: [text]
        files: ^tests/
        pass_filenames: false
        always_run: true

    -   id: no-unguarded-posix-patches
        name: No Unguarded POSIX-Only Symbol Patches in Tests
        entry: uv run python .githooks/check_posix_only_patches.py
        language: system
        types: [python]
        files: ^tests/

    -   id: no-unisolated-raw-cli-invoke
        name: No Unisolated Raw Side-Effecting CLI Invocations in Tests
        entry: uv run python .githooks/check_raw_cli_invoke.py
        language: system
        types: [python]
        files: ^tests/

    -   id: post-commit-test-gate
        name: Post-commit test gate
        entry: uv run python .githooks/post-commit.py
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false
