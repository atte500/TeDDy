name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-suite:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Check out repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-3.14-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync --frozen

    - name: Install clipboard backend (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xclip

    - name: Run Tests
      run: uv run pytest

  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Check out repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Set up Node.js (for jscpd)
      uses: actions/setup-node@v5
      with:
        node-version: "24"

    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2

    - name: Load cached venv
      id: cached-uv-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-quality-${{ runner.os }}-3.14-${{ hashFiles('**/uv.lock') }}

    - name: Install dependencies
      run: uv sync --frozen

    # Granular quality checks: each runs with `if: success() || failure()`
    # so every check executes and reports findings even if an earlier step failed.
    - name: "Secrets Check (detect-secrets)"
      if: success() || failure()
      run: |
        uv run pre-commit run detect-secrets --all-files

    - name: "File Hygiene (whitespace, formatting markers, JSON/TOML/YAML)"
      if: success() || failure()
      run: |
        uv run pre-commit run trailing-whitespace end-of-file-fixer check-toml check-yaml check-json check-added-large-files check-case-conflict check-merge-conflict --all-files

    - name: "Formatter (ruff format)"
      if: success() || failure()
      run: |
        uv run pre-commit run ruff-format --all-files

    - name: "Linter (ruff check)"
      if: success() || failure()
      run: |
        uv run pre-commit run ruff-lint --all-files

    - name: "Type Checker (mypy)"
      if: success() || failure()
      run: |
        uv run pre-commit run mypy --all-files --hook-stage manual

    - name: "Security Audit (bandit & pip-audit)"
      if: success() || failure()
      run: |
        uv run pre-commit run bandit pip-audit --all-files --hook-stage manual

    - name: "Structural Checks (DI boundaries, UTF-8, test isolation)"
      if: success() || failure()
      run: |
        uv run pre-commit run check-core-di-boundary check-explicit-utf8 no-hardcoded-tmp-paths no-unguarded-posix-patches no-unisolated-raw-cli-invoke --all-files --hook-stage manual

    - name: "Verify Test Pyramid"
      if: success() || failure()
      run: |
        uv run python scripts/verify_test_pyramid.py

    - name: "Check Python File Length (Max 300 Lines)"
      if: success() || failure()
      run: |
        find src tests -name "*.py" | xargs wc -l | awk '$1 > 300 && $2 != "total" {print "File " $2 " is too long (" $1 " lines)."; exit 1}'

    - name: "Detect Code Duplication (jscpd)"
      if: success() || failure()
      run: |
        npx jscpd --min-tokens 25 --threshold 0 --ignore "**/.venv/**,**/ports/**,**/prompts/**,**/spikes/**"
